<body>
   <form action="index.php" method="POST" enctype="multipart/form-data">
    <label for="username">username:</label>
    <input type="text" id="username"placeholder="hero" minlenght="6" maxlength="15" required><br>
    <label for="password">password:</label>
    <input type="password" id="password" minlenght="6" maxlength="15" required><br>

    <label for="email">email:</label>
    <input type="email" id="email" placeholder="aayushpurja@gmail.com"><br>
    
    <label for="phone">phone #:</label>
    <input type="tel" id="phone" placeholder="986-746-1266" pattern="[0-9]{3}-[0-9]{3}-[0-9]{3}"> <br>
    <label for="birth date">date:</label>
    <input type="birth" id="birth date " placeholder="mm/dd/yyyy"><br>

    <label for="quantity">quantity:</label>
    <input type="number" id-quantity min="0" max="99" value="1"><br>

    <label for="mr.">mr.</label>
    <input type="radio" id="mr." value="mr." name="title">
    <label for="ms.">ms.</label>
    <input type="radio" if="ms." value="ms." name="title">
    <label for="phD.">phD.</label>
    <input type="radio" id="phD" value="phD." name="title"><br>
    <label for="payment">payment</label>
    <select>
        <option value="esewa">esewa</option>
        <option value="khalti">khalti</option>
        <option value="bank">bank</option>
    </select><br>
    <label for="subscribe">subscribe:</label>
    <input type="checkbox" id="subscribe"><br>

    <label for="comment">comment:</label>
    <textarea id="comment" rows="3" cols="25"></textarea><br>

    <label for="file">file:</label>
    <input type="file" id="file" accecpt="image/png, iamge/jpeg"><br>

    <input type="reset"><br>
    <input type="submit">
</form>
